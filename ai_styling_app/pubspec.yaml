name: ai_styling_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2
  dio: ^5.9.0
  http_parser: ^4.0.2

  # Image selection and storage
  image_picker: ^1.1.2
  gal: ^2.3.1
  path_provider: ^2.1.5
  file_saver: ^0.4.0
  permission_handler: ^11.3.1

  # External links
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/home_page_image.png